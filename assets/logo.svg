<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Logo StudyAI : un petit robot étudiant posé sur un livre ouvert -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1ECFF"/>
      <stop offset="1" stop-color="#D9CFFF"/>
    </linearGradient>
    <linearGradient id="tete" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7B5CFA"/>
      <stop offset="1" stop-color="#4A2FD0"/>
    </linearGradient>
  </defs>

  <circle cx="120" cy="120" r="116" fill="url(#fond)"/>

  <!-- livre ouvert -->
  <path d="M120 180 C98 168 70 168 44 176 L44 210 C70 202 98 202 120 214 Z" fill="#FFFFFF" stroke="#4A2FD0" stroke-width="4" stroke-linejoin="round"/>
  <path d="M120 180 C142 168 170 168 196 176 L196 210 C170 202 142 202 120 214 Z" fill="#FFFFFF" stroke="#4A2FD0" stroke-width="4" stroke-linejoin="round"/>
  <path d="M60 186 C76 182 94 182 108 188 M60 196 C76 192 94 192 108 198" stroke="#C9BDFB" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M180 186 C164 182 146 182 132 188 M180 196 C164 192 146 192 132 198" stroke="#C9BDFB" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- oreilles -->
  <rect x="50" y="112" width="14" height="30" rx="6" fill="#3A2499"/>
  <rect x="176" y="112" width="14" height="30" rx="6" fill="#3A2499"/>

  <!-- tête -->
  <rect x="60" y="80" width="120" height="94" rx="30" fill="url(#tete)"/>
  <rect x="75" y="98" width="90" height="58" rx="20" fill="#1C1240"/>

  <!-- yeux contents et sourire -->
  <path d="M90 128 Q100 114 110 128" stroke="#3EF0CF" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M130 128 Q140 114 150 128" stroke="#3EF0CF" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M108 140 Q120 149 132 140" stroke="#3EF0CF" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="86" cy="142" r="5" fill="#FF8FB8" opacity="0.8"/>
  <circle cx="154" cy="142" r="5" fill="#FF8FB8" opacity="0.8"/>

  <!-- chapeau de diplômé -->
  <path d="M86 70 L86 84 Q120 98 154 84 L154 70 Z" fill="#2A1C66"/>
  <polygon points="120,42 186,64 120,86 54,64" fill="#1C1240"/>
  <polyline points="120,64 172,70 172,96" fill="none" stroke="#FFC845" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="166" y="94" width="12" height="16" rx="4" fill="#FFC845"/>
  <circle cx="120" cy="64" r="5" fill="#FFC845"/>

  <!-- petites étincelles -->
  <path d="M200 112 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 Z" fill="#FFC845"/>
  <path d="M38 76 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 Z" fill="#3EF0CF"/>
</svg>
